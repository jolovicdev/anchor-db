name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Several tests drive real `git` rather than hand-written diff text, so
      # they need an identity to commit with.
      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all commands
        run: go build ./cmd/...

  # The registry rejects a bad manifest at publish time, which is the end of a
  # release rather than the start of one. Checking it here means a release
  # cannot get that far with a manifest that will not be accepted.
  manifest:
    name: server.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate against the MCP Registry schema
        run: |
          set -euo pipefail
          python3 -m pip install --quiet check-jsonschema
          # The manifest names the schema it is written against, so the check
          # follows the file rather than a version pinned here.
          python3 - <<'PY' > /tmp/schema-url
          import json
          print(json.load(open("server.json"))["$schema"])
          PY
          curl -fsSL "$(cat /tmp/schema-url)" -o /tmp/server.schema.json
          check-jsonschema --schemafile /tmp/server.schema.json server.json
